name: Build

on:
  push:
  pull_request:

jobs:
  macos-native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build native Metal and auth probes
        run: cmake --build build --target native_metal_sharing_probe tcp_auth_test --parallel
      - name: Run TCP auth test
        run: ./build/tcp_auth_test

  windows-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NikNakk/dxmt
          ref: macos-xr-native-sharing
          path: dxmt
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Configure
        run: >
          cmake -S . -B build-win
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          -DDXMT_INCLUDE_DIR="$GITHUB_WORKSPACE/dxmt/include"
      - name: Build DXMT metadata probe
        run: cmake --build build-win --target dxmt_native_sharing_probe --parallel

  macos-proxy:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: macos-wine-xr
      - uses: actions/checkout@v4
        with:
          repository: NikNakk/monado
          ref: macos-upstream-clean
          path: monado
      - name: Install Monado dependencies
        run: >-
          brew install ceres-solver cmake eigen glslang jpeg-turbo libusb molten-vk ninja
          pkgconf sdl2-compat vulkan-headers vulkan-loader
      - name: Configure Monado
        run: cmake -S monado -B monado/build -G Ninja -DCMAKE_FIND_FRAMEWORK=LAST
      - name: Build Monado IPC ABI
        run: cmake --build monado/build --target ipc_shared monado_metal_xpc_client --parallel
      - name: Configure bridge proxy
        run: >
          cmake -S macos-wine-xr -B macos-wine-xr/build-proxy -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMONADO_SOURCE_DIR="$GITHUB_WORKSPACE/monado"
          -DMONADO_BUILD_DIR="$GITHUB_WORKSPACE/monado/build"
      - name: Build proxy
        run: cmake --build macos-wine-xr/build-proxy --target macos_wine_xr_proxy --parallel

  macos-windows-client:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: macos-wine-xr
      - uses: actions/checkout@v4
        with:
          repository: NikNakk/dxmt
          ref: macos-xr-native-sharing
          path: dxmt
      - name: Install cross-build dependencies
        run: brew install cmake ninja mingw-w64
      - name: Build bridge-owned Win64 OpenXR client
        working-directory: macos-wine-xr
        env:
          DXMT_SOURCE_DIR: ${{ github.workspace }}/dxmt
          MACOS_WINE_XR_CLIENT_ROOT: ${{ github.workspace }}/client-build
        run: ./scripts/build-wine-openxr-client.zsh

