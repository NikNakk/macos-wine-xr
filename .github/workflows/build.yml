name: Build

on:
  push:
  pull_request:

jobs:
  macos-native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NikNakk/dxmt
          ref: macos-xr-native-sharing
          path: dxmt
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenXR-SDK
          ref: release-1.1.63
          path: OpenXR-SDK
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DDXMT_INCLUDE_DIR="$GITHUB_WORKSPACE/dxmt/include"
          -DOPENXR_INCLUDE_DIR="$GITHUB_WORKSPACE/OpenXR-SDK/include"
      - name: Build native OpenXR, reverse-sharing and auth probes
        run: >
          cmake --build build --target native_metal_sharing_probe tcp_auth_test
          native_capability_test native_openxr_backend_probe native_openxr_blit_probe
          dxmt_reverse_import_probe macos_wine_xr_host rpc_serialization_test rpc_transport_test
          graphics_interposer_test graphics_interposer_control_test fence_wait_test --parallel
      - name: Test authentication and native capability lifetime
        run: ctest --test-dir build --output-on-failure

  windows-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NikNakk/dxmt
          ref: macos-xr-native-sharing
          path: dxmt
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenXR-SDK
          ref: release-1.1.63
          path: OpenXR-SDK
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Configure
        run: >
          cmake -S . -B build-win
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          -DDXMT_INCLUDE_DIR="$GITHUB_WORKSPACE/dxmt/include"
          -DOPENXR_INCLUDE_DIR="$GITHUB_WORKSPACE/OpenXR-SDK/include"
      - name: Build DXMT metadata and reverse-import probes
        run: cmake --build build-win --target dxmt_window_probe dxmt_native_sharing_probe dxmt_reverse_import_probe macos_wine_xr_openxr openxr_rpc_smoke rpc_serialization_test --parallel
